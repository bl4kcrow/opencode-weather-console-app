name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::package.json has no 'version' field. Add one (e.g. \"version\": \"1.0.0\")."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        run: |
          if git ls-remote --exit-code origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists on origin. Bump the version in package.json to publish a new release."
            exit 1
          fi

      - name: Build binary (bun run build)
        run: |
          bun run build
          mkdir -p dist
          mv weather dist/weather-linux-x64

      - name: Cross-compile macOS arm64
        run: bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile dist/weather-darwin-arm64

      - name: Cross-compile Windows x64
        run: bun build --compile --target=bun-windows-x64 src/index.ts --outfile dist/weather-windows-x64.exe

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Versión ${{ steps.version.outputs.version }}

            Binarios:
            - weather-linux-x64 (Linux x64)
            - weather-darwin-arm64 (macOS arm64)
            - weather-windows-x64.exe (Windows x64)
          files: dist/*